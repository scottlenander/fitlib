[project]
name = "fitlib"
version = "0.1.0"
description = "Local library for storing and analysing cycling .fit files from Zwift and Garmin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.0",
    "fitdecode>=0.11.0",
    "keyring>=25.7.0",
    "polars>=2.1.0",
    "python-multipart>=0.0.33",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
    "watchdog>=7.1.0",
]

[project.scripts]
fitlib = "fitlib.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fit-tool>=0.9.17",
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
# Constructor arguments are documented in the class docstring (Google style).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test helpers use Google-style docstrings too; test functions keep their own format
# (description, Given, Expect), which the Google rules accept. Test packages need no
# docstring, and the perf script is tooling.
"tests/**" = ["D104"]
"scripts/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.importlinter]
root_package = "fitlib"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the store factory and the store's own modules use a concrete backend"
type = "forbidden"
source_modules = [
    "fitlib.models",
    "fitlib.ingest",
    "fitlib.metrics",
    "fitlib.cli",
    "fitlib.api",
    "fitlib.display",
    "fitlib.config",
    "fitlib.analysis",
    "fitlib.metadata",
    "fitlib.sync",
    "fitlib.services",
]
forbidden_modules = ["fitlib.store.local", "fitlib.store.memory", "sqlite3"]
# Going through fitlib.store.factory is the intended route to a backend.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers: models <- metrics <- ingest <- analysis | sync <- services <- api <- cli"
type = "layers"
layers = [
    "fitlib.cli",
    "fitlib.api",
    "fitlib.services",
    "fitlib.analysis | fitlib.sync",
    "fitlib.ingest",
    "fitlib.metrics",
    "fitlib.models",
]

[[tool.importlinter.contracts]]
name = "Metrics and ingest never touch storage"
type = "forbidden"
source_modules = ["fitlib.metrics", "fitlib.ingest", "fitlib.models", "fitlib.metadata"]
forbidden_modules = ["fitlib.store"]

[[tool.importlinter.contracts]]
name = "The web app and the command line do their work through services"
type = "forbidden"
source_modules = ["fitlib.api", "fitlib.cli"]
forbidden_modules = ["fitlib.metrics", "fitlib.ingest", "fitlib.services.deleting"]
# Services use them, so the API and CLI reach them through services.
allow_indirect_imports = true
# Names only: types, constants, errors and lookups the API and CLI show or check against.
ignore_imports = [
    "fitlib.api.errors -> fitlib.ingest.localtime",  # UnknownTimeZone
    "fitlib.api.errors -> fitlib.metrics.zwift",  # UnknownWorld
    "fitlib.api.schemas -> fitlib.metrics.zones",  # zone names
    "fitlib.api.schemas -> fitlib.metrics.load",  # ThresholdSource, TssSource
    "fitlib.api.schemas -> fitlib.metrics.track",  # Track
    "fitlib.api.routers.worlds -> fitlib.metrics.zwift",  # WORLDS
    "fitlib.api.routers.imports -> fitlib.ingest.scanner",  # FIT_SUFFIX, ZIP_SUFFIX
    "fitlib.api.routers.health -> fitlib.ingest.summarize",  # METRICS_VERSION
    "fitlib.api.routers.settings -> fitlib.ingest.localtime",  # time_zones
    "fitlib.cli.common -> fitlib.ingest.summarize",  # METRICS_VERSION
    "fitlib.cli.common -> fitlib.metrics.zwift",  # UnknownWorld
    "fitlib.cli.output -> fitlib.metrics.zones",  # zone names
    "fitlib.cli.output -> fitlib.metrics.curves",  # best_at, reading a stored curve
    "fitlib.cli.output -> fitlib.metrics.load",  # TssSource
    "fitlib.cli.rides -> fitlib.ingest.summarize",  # METRICS_VERSION
    "fitlib.cli.rides -> fitlib.metrics.curves",  # best_at, reading a stored curve
    "fitlib.cli.rides -> fitlib.ingest.scanner",  # scan, counting files for `import`'s progress bar
    "fitlib.cli.timezone -> fitlib.ingest.localtime",  # UnknownTimeZone
]

[[tool.importlinter.contracts]]
name = "Inside services: compare <- request-level services <- workers <- errors"
type = "layers"
containers = ["fitlib.services"]
layers = [
    "compare",
    "rides | bikes | athlete | watching",
    "importing | recompute | deleting | context",
    "errors",
]
