name: E2E

# Playwright end-to-end tests (tests/e2e/), on pull requests only. Make the
# "Playwright (Chromium)" check required before merging in the branch rules.
# No path filters: a required check that's skipped never reports, which blocks merging.
on:
  pull_request:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - uses: actions/checkout@v6

      # The e2e server runs fitlib (Python) and builds the web app (Node).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        working-directory: .
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - name: Install web app dependencies
        working-directory: web
        run: npm ci

      - name: Install test dependencies
        run: npm ci

      - name: Lint, typecheck and check formatting
        run: npm run lint && npm run typecheck && npm run format:check

      # Browsers are cached per Playwright version; system libraries are always installed.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Starts scripts/e2e-server itself: builds web/, imports the fixtures into a temp
      # library and serves it on port 3200.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Keep the report, traces and screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
