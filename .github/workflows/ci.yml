name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check module boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest

  web:
    name: Web (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      # Python too, to check the generated API types against the API.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        working-directory: .
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and check formatting
        run: npm run lint && npm run typecheck && npm run format:check

      - name: Unit tests
        run: npm test

      - name: API types match the API
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::web/src/api/schema.d.ts is out of date. Run 'npm run api:types' in web/ and commit it."
            exit 1
          }

      - name: Build
        run: npm run build
